
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SFL 3D Football</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center;overflow:hidden}
header{padding:10px;background:#17252e}
h2{margin:0;color:#67e8a5}
#score{font-size:24px;font-weight:bold;margin:8px}
#game{width:100%;height:65vh;display:block}
.controls{display:flex;justify-content:space-around;align-items:center;padding:10px;gap:8px}
button{border:0;border-radius:12px;padding:15px;background:#16854d;color:white;font-weight:bold;font-size:16px}
#stick{width:110px;height:110px;border-radius:50%;background:#354550;border:3px solid #9ca3af;position:relative;touch-action:none}
#knob{width:42px;height:42px;border-radius:50%;background:#67e8a5;position:absolute;left:31px;top:31px}
small{color:#cbd5e1}
</style>
</head>
<body>
<header><h2>SEMENJAYA FOOTBALL LEAGUE</h2><small>Prototaip 3D • Pasukan 3F</small></header>
<div id="score">3F 0 - 0 AI</div>
<div id="game"></div>
<div class="controls">
<div id="stick"><div id="knob"></div></div>
<div>
<button id="pass">PAS</button>
<button id="shoot">SHOOT</button>
<button id="reset">RESET</button>
</div>
</div>
<small>Gerakkan pemain dengan joystick. Dekati bola untuk menendang.</small>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const area=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,75);
const camera=new THREE.PerspectiveCamera(55,area.clientWidth/area.clientHeight,0.1,100);
camera.position.set(0,17,22);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(area.clientWidth,area.clientHeight);
area.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x446644,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,12,8);scene.add(sun);
function box(w,h,d,color,x,y,z){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));
m.position.set(x,y,z);scene.add(m);return m;
}
box(30,.2,44,0x168447,0,-.15,0);
for(let z=-20;z<20;z+=5)box(30,.02,5,0x218f4b,0,-.035,z);
function line(points,color=0xffffff){
const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));
scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color})));
}
line([[-14,0,-20],[14,0,-20],[14,0,20],[-14,0,20],[-14,0,-20]]);
line([[-14,0,0],[14,0,0]]);
const circle=new THREE.Mesh(new THREE.RingGeometry(3.9,4,.64),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));
circle.rotation.x=-Math.PI/2;circle.position.y=.02;scene.add(circle);
function goal(z){
box(7,.18,.3,0xffffff,0,2,z);
box(.18,4,.3,0xffffff,-3.5,0,z);
box(.18,4,.3,0xffffff,3.5,0,z);
}
goal(-20);goal(20);
function player(color,x,z){
const group=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.48,.55,1.25,12),new THREE.MeshStandardMaterial({color}));
body.position.y=1.25;group.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,12),new THREE.MeshStandardMaterial({color:0xf0c9a4}));
head.position.y=2.12;group.add(head);
const legmat=new THREE.MeshStandardMaterial({color:0x202530});
for(let s of [-1,1]){
const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.75,.25),legmat);
leg.position.set(s*.2,.48,0);group.add(leg);
}
group.position.set(x,0,z);scene.add(group);return group;
}
const user=player(0x1678ff,0,8);
const ai=player(0xe53935,2,-7);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.36,20,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}));
ball.position.set(0,.4,5);scene.add(ball);
const stripe=new THREE.Mesh(new THREE.TorusGeometry(.25,.025,6,16),new THREE.MeshBasicMaterial({color:0x111111}));
stripe.position.y=.4;ball.add(stripe);
let score=0,enemyScore=0,vx=0,vz=0,bvx=0,bvz=0;
const scoreEl=document.getElementById('score');
function updateScore(){scoreEl.textContent='3F '+score+' - '+enemyScore+' AI';}
function kick(power){
const dx=ball.position.x-user.position.x,dz=ball.position.z-user.position.z;
if(Math.hypot(dx,dz)<3.5){
const len=Math.hypot(dx,dz)||1;
bvx=(dx/len)*power;
bvz=(dz/len)*power;
if(power>0.28){bvz=-Math.abs(power)*1.6;}
}
}
document.getElementById('pass').onclick=()=>kick(.24);
document.getElementById('shoot').onclick=()=>kick(.65);
document.getElementById('reset').onclick=()=>{
user.position.set(0,0,8);ai.position.set(2,0,-7);
ball.position.set(0,.4,5);bvx=0;bvz=0;
};
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let active=false,dx=0,dy=0;
function moveStick(e){
const r=stick.getBoundingClientRect();
let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
const len=Math.hypot(x,y),max=35;
if(len>max){x=x/len*max;y=y/len*max;}
dx=x/max;dy=y/max;
knob.style.left=(31+x)+'px';knob.style.top=(31+y)+'px';
}
stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(active)moveStick(e)});
function stopStick(){active=false;dx=0;dy=0;knob.style.left='31px';knob.style.top='31px'}
stick.addEventListener('pointerup',stopStick);
stick.addEventListener('pointercancel',stopStick);
window.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'||e.key==='a')dx=-1;
if(e.key==='ArrowRight'||e.key==='d')dx=1;
if(e.key==='ArrowUp'||e.key==='w')dy=-1;
if(e.key==='ArrowDown'||e.key==='s')dy=1;
if(e.key===' ')kick(.65);
});
window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s'].includes(e.key)){dx=0;dy=0}});
function animate(){
requestAnimationFrame(animate);
user.position.x+=dx*.13;user.position.z+=dy*.13;
user.position.x=Math.max(-13,Math.min(13,user.position.x));
user.position.z=Math.max(-19,Math.min(19,user.position.z));
const adx=user.position.x-ai.position.x,adz=user.position.z-ai.position.z;
if(Math.hypot(adx,adz)>1){ai.position.x+=Math.sign(adx)*.035;ai.position.z+=Math.sign(adz)*.035;}
ball.position.x+=bvx;ball.position.z+=bvz;
bvx*=.985;bvz*=.985;
if(Math.abs(ball.position.x)>14){ball.position.x=Math.sign(ball.position.x)*14;bvx*=-.7}
if(Math.abs(ball.position.z)>21){
if(ball.position.z<0)score++;else enemyScore++;
updateScore();ball.position.set(0,.4,0);bvx=0;bvz=0;
}
ball.position.y=.4+Math.abs(Math.sin(Date.now()*.008))*Math.min(.18,Math.hypot(bvx,bvz));
ball.rotation.x+=.04;ball.rotation.z+=.03;
camera.position.x+=(user.position.x-camera.position.x)*.025;
camera.position.z+=(user.position.z+14-camera.position.z)*.025;
camera.lookAt(user.position.x,0,user.position.z-2);
renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
camera.aspect=area.clientWidth/area.clientHeight;camera.updateProjectionMatrix();
renderer.setSize(area.clientWidth,area.clientHeight);
});
animate();
</script>
</body>
</html>
